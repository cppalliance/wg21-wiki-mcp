[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wg21-wiki-mcp"
version = "0.3.1"
description = "Local stdio MCP server that serves the WG21 (ISO C++) committee wiki as a verifiable source of truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSL-1.0" }
authors = [{ name = "The C++ Alliance, Inc." }]
keywords = ["mcp", "model-context-protocol", "wg21", "isocpp", "mediawiki"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Boost Software License 1.0 (BSL-1.0)",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.27,<3",
    "mwclient>=0.11.0,<0.12",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests>=2.31",
    "pre-commit>=3.7",
    "pip-tools==7.6.0",
]

[project.scripts]
wg21-wiki-mcp = "wg21_wiki_mcp.server:main"

[project.urls]
Homepage = "https://github.com/cppalliance/wg21-wiki-mcp"
Documentation = "https://github.com/cppalliance/wg21-wiki-mcp#readme"
PyPI = "https://pypi.org/project/wg21-wiki-mcp/"

[tool.hatch.build.targets.wheel]
packages = ["src/wg21_wiki_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--benchmark-disable --cov=wg21_wiki_mcp --cov-branch --cov-report=term-missing --cov-fail-under=95"
markers = [
    "live: tests that hit the real wiki using configured credentials (skip locally/on fork PRs; fail on protected CI when blocked)",
    "canary: minimal live smoke (bot login + one read-only tool; subset of live)",
    "latency_gate: meeting-time composite latency regressions (ubuntu/py3.12 CI gate)",
    "benchmark: throughput/latency benchmarks (run with pytest --benchmark-only)",
]

[tool.coverage.run]
branch = true
source = ["wg21_wiki_mcp"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true
# Per-module floors enforced in CI via `coverage report --include=... --fail-under=...`:
# wiki_client >= 85%, tools >= 90%, fetch >= 90%, meetings >= 85%.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
