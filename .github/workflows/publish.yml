name: Publish

on:
  release:
    types: [published]

# Least privilege: no workflow-level token scope. Each job grants only what it needs.
permissions: {}

jobs:
  test:
    name: CI
    # The reusable CI only reads the repo; do not forward write scope or secrets.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  pypi-publish:
    name: publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub Release and upload assets
      id-token: write # OIDC for PyPI Trusted Publishing and Sigstore
    environment:
      name: pypi
      url: https://pypi.org/p/wg21-wiki-mcp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${TAG_NAME}" in
            v*) TAG_VERSION="${TAG_NAME#v}" ;;
            *)
              echo "::error::Expected tag vX.Y.Z, got ${TAG_NAME}"
              exit 1
              ;;
          esac
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          PKG_VERSION=$(python -c "
          import pathlib
          import re
          text = pathlib.Path('src/wg21_wiki_mcp/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\\s*=\\s*[\"\\']([^\"\\']+)[\"\\']', text, re.M)
          if not match:
              raise SystemExit('__version__ not found in src/wg21_wiki_mcp/__init__.py')
          print(match.group(1))
          ")
          echo "Tag version: ${TAG_VERSION}"
          echo "pyproject.toml version: ${PYPROJECT_VERSION}"
          echo "__init__.py version: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ] || [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} (${TAG_VERSION}) must match pyproject.toml (${PYPROJECT_VERSION}) and __init__.py (${PKG_VERSION}) before publish"
            exit 1
          fi
      - name: Verify lockfile present
        run: |
          set -euo pipefail
          if [ ! -f requirements-lock.txt ]; then
            echo "::error::requirements-lock.txt is missing on this ref; the SBOM step cannot build a reproducible environment. Create the release tag from the intended release commit that includes requirements-lock.txt."
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python -m pip install cyclonedx-bom
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install -r requirements-lock.txt
          .sbom-venv/bin/pip install --no-deps dist/*.whl
          cyclonedx-py environment .sbom-venv/bin/python \
            --output-format json \
            --output-file sbom.cdx.json
      - name: Stage artifacts for Sigstore signing
        run: |
          set -euo pipefail
          mkdir -p signing
          cp dist/*.tar.gz dist/*.whl sbom.cdx.json signing/
      - name: Sign distributions and SBOM (Sigstore)
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            ./signing/*.tar.gz
            ./signing/*.whl
            ./signing/sbom.cdx.json
          release-signing-artifacts: false
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
      - name: Attach SBOM and signed artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
          shopt -s nullglob
          SIGSTORE_BUNDLES=(signing/*.sigstore.json)
          shopt -u nullglob
          gh release upload "${TAG}" \
            dist/*.tar.gz \
            dist/*.whl \
            sbom.cdx.json \
            "${SIGSTORE_BUNDLES[@]}" \
            --clobber
