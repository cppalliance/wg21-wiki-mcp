name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for organization repos.
# The MIT-licensed gitleaks CLI is free; install and run it directly instead.

env:
  GITLEAKS_VERSION: "8.24.2"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: offline (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy src
      - name: Tests + coverage gate (offline)
        run: pytest -m "not live"

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf "${base}/${tarball}" -o "/tmp/${tarball}"
          curl -sSLf "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          match_count=$(grep -Fc " ${tarball}" /tmp/gitleaks_checksums.txt)
          if [ "${match_count}" -ne 1 ]; then
            echo "Expected exactly one checksum line for ${tarball}, got ${match_count}"
            exit 1
          fi
          grep -F " ${tarball}" /tmp/gitleaks_checksums.txt | (cd /tmp && sha256sum --check)
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "Scanning ${BASE}..${HEAD}"
          gitleaks detect \
            --source . \
            --log-opts="${BASE}..${HEAD}" \
            --redact \
            --verbose
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --redact \
            --verbose

  live:
    name: live (secrets)
    runs-on: ubuntu-latest
    # Live tests use real credentials; they auto-skip when secrets are absent.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live tests (skip if no secrets; no coverage gate)
        env:
          WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
          WIKI_USER_USERNAME: ${{ secrets.WIKI_USER_USERNAME }}
          WIKI_USER_PASSWORD: ${{ secrets.WIKI_USER_PASSWORD }}
        run: pytest -m live --no-cov
