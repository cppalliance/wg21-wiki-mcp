name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for organization repos.
# The MIT-licensed gitleaks CLI is free; install and run it directly instead.

env:
  GITLEAKS_VERSION: "8.24.2"

jobs:
  dependency-health:
    name: dependency health (mwclient release age)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check mwclient release age (12-month review signal)
        continue-on-error: true
        run: python scripts/check_mwclient_release_age.py --max-age-days 365 --fail-reason review
      - name: Check mwclient hard migration trigger (24 months)
        run: >-
          python scripts/check_mwclient_release_age.py
          --max-age-days 730 --fail-reason hard
          --waiver-file config/mwclient-release-age-waiver.json

  lockfile:
    name: lockfile reproducibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps .
          python -c "import wg21_wiki_mcp; print(wg21_wiki_mcp.__version__)"
      - name: Verify lockfile is current
        run: |
          # pip-tools 7.6.0 breaks on pip 26.2+ (stdlib_pkgs removed from pip internals).
          python -m pip install "pip>=26,<26.2" pip-tools==7.6.0
          pip-compile pyproject.toml --output-file=requirements-lock.txt --strip-extras
          git diff --exit-code requirements-lock.txt

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Verify API reference is current
        run: python scripts/build_api_docs.py --check

  benchmark:
    name: benchmark (cache + meeting-time)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run cache benchmarks
        # benchmarks/cache-baseline.json holds honest measured means from this
        # runner (ubuntu-latest, Python 3.12). Regenerate from the benchmark-json
        # artifact when benchmark code changes.
        run: |
          pytest tests/test_benchmark.py --benchmark-only --no-cov \
            -o addopts= \
            --benchmark-json=benchmark.json \
            --benchmark-warmup=on \
            --benchmark-min-rounds=10
      - name: Benchmark regression gate
        # Blocking gate. These are microbenchmarks (µs scale) where shared-runner
        # StdDev is ~equal to the mean, so a tight threshold flakes on noise alone.
        # 50% catches genuine regressions (>=1.5x slowdowns) while tolerating jitter;
        # we still re-run once before failing to absorb one-off runner spikes.
        run: |
          set -euo pipefail
          check() {
            python scripts/check_benchmark_regression.py \
              benchmark.json benchmarks/cache-baseline.json \
              --max-regression 0.5
          }
          if check; then
            exit 0
          fi
          echo "::warning::Regression gate failed once; re-running benchmarks for runner noise..."
          pytest tests/test_benchmark.py --benchmark-only --no-cov \
            -o addopts= \
            --benchmark-json=benchmark.json \
            --benchmark-warmup=on \
            --benchmark-min-rounds=10
          check
      - name: Run meeting-time benchmarks
        # benchmarks/meeting-time-baseline.json holds measured means from this
        # runner (ubuntu-latest, Python 3.12). Regenerate from the benchmark-json
        # artifact when meeting-time benchmark code changes.
        run: |
          pytest tests/test_meeting_time_benchmark.py --benchmark-only --no-cov \
            -o addopts= \
            --benchmark-json=meeting-time-benchmark.json \
            --benchmark-warmup=off \
            --benchmark-min-rounds=5
      - name: Meeting-time benchmark regression gate
        # Blocking gate. Meeting-time composites are ms-scale on shared runners where
        # jitter is material; 50% catches genuine regressions (>=1.5x slowdowns) while
        # tolerating noise. We still re-run once before failing to absorb one-off spikes.
        run: |
          set -euo pipefail
          check_meeting() {
            python scripts/check_benchmark_regression.py \
              meeting-time-benchmark.json benchmarks/meeting-time-baseline.json \
              --max-regression 0.5
          }
          if check_meeting; then
            exit 0
          fi
          echo "::warning::Meeting-time regression gate failed once; re-running benchmarks..."
          pytest tests/test_meeting_time_benchmark.py --benchmark-only --no-cov \
            -o addopts= \
            --benchmark-json=meeting-time-benchmark.json \
            --benchmark-warmup=off \
            --benchmark-min-rounds=5
          check_meeting
      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-json
          path: |
            benchmark.json
            meeting-time-benchmark.json

  test:
    name: offline (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      # shellcheck ships with the ubuntu runner image. Unquoted expansions in the
      # VPN script would otherwise surface as an unexplained live-tier failure.
      - name: Lint CI shell scripts (shellcheck)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: shellcheck scripts/ci/*.sh
      - name: Type-check (mypy)
        run: mypy src
      - name: Verify API reference is current
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/build_api_docs.py --check
      - name: Tests + coverage gate (offline)
        run: pytest -m "not live and not latency_gate"
      - name: Meeting-time latency gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest -m latency_gate -q --cov-append --cov-fail-under=0
      - name: Per-module coverage gates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage report --include="*/wiki_client.py" --fail-under=85
          coverage report --include="*/tools.py" --fail-under=90
          coverage report --include="*/fetch.py" --fail-under=90
          coverage report --include="*/meetings.py" --fail-under=85
      - name: Write coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: coverage xml -o coverage.xml
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  canary:
    name: canary (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Personal wiki credentials live in the live-wiki environment (not repo secrets).
    environment: live-wiki
    env:
      CI_REQUIRE_LIVE_CREDS: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)) && '1' || '' }}
      # Wider than the gate above on purpose. A manual dispatch can read secrets,
      # so it should get the tunnel and really exercise the wiki, but it must keep
      # skipping rather than failing on a block, which is what the narrower gate
      # decides. Without this a dispatch would run the live tier unrouted, hit
      # Cloudflare, skip, and report green.
      VPN_REQUIRED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)) && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Connect VPN
        if: env.VPN_REQUIRED == '1'
        env:
          TORGUARD_VPN_USERNAME: ${{ secrets.TORGUARD_VPN_USERNAME }}
          TORGUARD_VPN_PASSWORD: ${{ secrets.TORGUARD_VPN_PASSWORD }}
          # Prefer the variable: the location is not a credential, and as a secret
          # the runner masks it, so "location '***' is not in the bundle" would be
          # the one message that cannot say what is wrong.
          TORGUARD_VPN_LOCATION: ${{ vars.TORGUARD_VPN_LOCATION || secrets.TORGUARD_VPN_LOCATION }}
        run: bash scripts/ci/torguard_vpn.sh connect
      - name: Verify split tunnel
        if: env.VPN_REQUIRED == '1'
        run: bash scripts/ci/torguard_vpn.sh verify
      - name: Canary smoke (login + one read-only tool)
        env:
          WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
          WIKI_USER_USERNAME: ${{ secrets.WIKI_USER_USERNAME }}
          WIKI_USER_PASSWORD: ${{ secrets.WIKI_USER_PASSWORD }}
        run: pytest -m canary --no-cov -o log_cli=true --log-cli-level=WARNING
      # verb 3 records the handshake and the negotiated cipher, never the
      # credentials, so the log is safe to publish as a build artifact.
      - name: Upload VPN log
        if: failure() && env.VPN_REQUIRED == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vpn-log-canary
          path: ${{ runner.temp }}/torguard-vpn/vpn.log
          if-no-files-found: ignore
      - name: Disconnect VPN
        if: always() && env.VPN_REQUIRED == '1'
        run: bash scripts/ci/torguard_vpn.sh disconnect

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf "${base}/${tarball}" -o "/tmp/${tarball}"
          curl -sSLf "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          match_count=$(grep -Fc " ${tarball}" /tmp/gitleaks_checksums.txt)
          if [ "${match_count}" -ne 1 ]; then
            echo "Expected exactly one checksum line for ${tarball}, got ${match_count}"
            exit 1
          fi
          grep -F " ${tarball}" /tmp/gitleaks_checksums.txt | (cd /tmp && sha256sum --check)
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "Scanning ${BASE}..${HEAD}"
          gitleaks detect \
            --source . \
            --log-opts="${BASE}..${HEAD}" \
            --redact \
            --verbose
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --redact \
            --verbose

  live:
    name: live (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Personal wiki credentials live in the live-wiki environment (not repo secrets).
    environment: live-wiki
    env:
      # See the canary job for why these two gates differ.
      CI_REQUIRE_LIVE_CREDS: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)) && '1' || '' }}
      VPN_REQUIRED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)) && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Connect VPN
        if: env.VPN_REQUIRED == '1'
        env:
          TORGUARD_VPN_USERNAME: ${{ secrets.TORGUARD_VPN_USERNAME }}
          TORGUARD_VPN_PASSWORD: ${{ secrets.TORGUARD_VPN_PASSWORD }}
          TORGUARD_VPN_LOCATION: ${{ vars.TORGUARD_VPN_LOCATION || secrets.TORGUARD_VPN_LOCATION }}
        run: bash scripts/ci/torguard_vpn.sh connect
      - name: Verify split tunnel
        if: env.VPN_REQUIRED == '1'
        run: bash scripts/ci/torguard_vpn.sh verify
      # --no-cov: offline matrix already enforces the 95% package gate and per-module
      # floors; live tests hit the real wiki (slow, credential-bound) and must not emit
      # coverage artifacts that could correlate execution with confidential page access.
      - name: Live tests (fail on protected CI when credentials missing or wiki blocked)
        env:
          WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
          WIKI_USER_USERNAME: ${{ secrets.WIKI_USER_USERNAME }}
          WIKI_USER_PASSWORD: ${{ secrets.WIKI_USER_PASSWORD }}
        run: pytest -m live --no-cov -o log_cli=true --log-cli-level=WARNING
      - name: Upload VPN log
        if: failure() && env.VPN_REQUIRED == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vpn-log-live
          path: ${{ runner.temp }}/torguard-vpn/vpn.log
          if-no-files-found: ignore
      - name: Disconnect VPN
        if: always() && env.VPN_REQUIRED == '1'
        run: bash scripts/ci/torguard_vpn.sh disconnect
