name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for organization repos.
# The MIT-licensed gitleaks CLI is free; install and run it directly instead.

env:
  GITLEAKS_VERSION: "8.24.2"

jobs:
  lockfile:
    name: lockfile reproducibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps .
          python -c "import wg21_wiki_mcp; print(wg21_wiki_mcp.__version__)"
      - name: Verify lockfile is current
        run: |
          pip install pip-tools==7.5.3
          pip-compile pyproject.toml --output-file=requirements-lock.txt --strip-extras
          git diff --exit-code requirements-lock.txt

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: offline (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy src
      - name: Tests + coverage gate (offline)
        run: pytest -m "not live"
      - name: Per-module coverage gates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage report --include="*/wiki_client.py" --fail-under=85
          coverage report --include="*/tools.py" --fail-under=90
          coverage report --include="*/fetch.py" --fail-under=90
          coverage report --include="*/meetings.py" --fail-under=85
      - name: Write coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: coverage xml -o coverage.xml
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  canary:
    name: canary (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Personal wiki credentials live in the live-wiki environment (not repo secrets).
    environment: live-wiki
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Canary smoke (login + one read-only tool; skip if no secrets)
        env:
          WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
          WIKI_USER_USERNAME: ${{ secrets.WIKI_USER_USERNAME }}
          WIKI_USER_PASSWORD: ${{ secrets.WIKI_USER_PASSWORD }}
        run: pytest -m canary --no-cov

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf "${base}/${tarball}" -o "/tmp/${tarball}"
          curl -sSLf "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          match_count=$(grep -Fc " ${tarball}" /tmp/gitleaks_checksums.txt)
          if [ "${match_count}" -ne 1 ]; then
            echo "Expected exactly one checksum line for ${tarball}, got ${match_count}"
            exit 1
          fi
          grep -F " ${tarball}" /tmp/gitleaks_checksums.txt | (cd /tmp && sha256sum --check)
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "Scanning ${BASE}..${HEAD}"
          gitleaks detect \
            --source . \
            --log-opts="${BASE}..${HEAD}" \
            --redact \
            --verbose
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --redact \
            --verbose

  live:
    name: live (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Personal wiki credentials live in the live-wiki environment (not repo secrets).
    environment: live-wiki
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # --no-cov: offline matrix already enforces the 95% package gate and per-module
      # floors; live tests hit the real wiki (slow, credential-bound) and must not emit
      # coverage artifacts that could correlate execution with confidential page access.
      - name: Live tests (fail when credentials present; skip when absent)
        env:
          WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
          WIKI_USER_USERNAME: ${{ secrets.WIKI_USER_USERNAME }}
          WIKI_USER_PASSWORD: ${{ secrets.WIKI_USER_PASSWORD }}
        run: pytest -m live --no-cov
